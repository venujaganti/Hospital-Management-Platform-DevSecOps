name: Hospital DevSecOps Pipeline

on:

  push:

    branches:
      - main
      - develop

  pull_request:

    branches:
      - main


permissions:

  contents: read

  security-events: write


jobs:


  test:

    name: Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4


      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: "20"

          cache: npm

          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json


      - name: Install Backend Dependencies

        working-directory: backend

        run: npm ci


      - name: Install Frontend Dependencies

        working-directory: frontend

        run: npm ci


      - name: Backend Tests

        working-directory: backend

        run: npm test


      - name: Frontend Build

        working-directory: frontend

        run: npm run build


  codeql:

    name: CodeQL Security Scan

    runs-on: ubuntu-latest

    permissions:

      contents: read

      security-events: write

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4


      - name: Initialize CodeQL

        uses: github/codeql-action/init@v3

        with:

          languages: javascript


      - name: Analyze Code

        uses: github/codeql-action/analyze@v3


  trivy-filesystem:

    name: Trivy Filesystem Scan

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4


      - name: Run Trivy

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          exit-code: "1"


  docker:

    name: Docker Build and Security Scan

    runs-on: ubuntu-latest

    needs:

      - test

      - codeql

      - trivy-filesystem

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4


      - name: Build Backend

        run: |
          docker build \
            -t hospital-backend:${{ github.sha }} \
            ./backend


      - name: Build Frontend

        run: |
          docker build \
            -t hospital-frontend:${{ github.sha }} \
            ./frontend


      - name: Scan Backend Image

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: hospital-backend:${{ github.sha }}

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          exit-code: "1"


      - name: Scan Frontend Image

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: hospital-frontend:${{ github.sha }}

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          exit-code: "1"


      - name: Quality Gate

        run: |
          echo "======================================"
          echo " DEVSECOPS QUALITY GATE PASSED"
          echo "======================================"