services:

  mysql:

    image: mysql:8.0

    container_name: hospital-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: rootpassword

      MYSQL_DATABASE: hospitaldb

      MYSQL_USER: hospitaluser

      MYSQL_PASSWORD: hospitalpassword

    volumes:

      - mysql_data:/var/lib/mysql

    networks:

      - hospital-network


  backend:

    build:

      context: ./backend

      dockerfile: Dockerfile

    container_name: hospital-backend

    restart: unless-stopped

    environment:

      NODE_ENV: production

      PORT: 5000

      DB_HOST: mysql

      DB_PORT: 3306

      DB_NAME: hospitaldb

      DB_USER: hospitaluser

      DB_PASSWORD: hospitalpassword

    ports:

      - "5000:5000"

    depends_on:

      - mysql

    networks:

      - hospital-network


  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    container_name: hospital-frontend

    restart: unless-stopped

    environment:

      BACKEND_HOST: backend

      BACKEND_PORT: 5000

    ports:

      - "3000:80"

    depends_on:

      - backend

    networks:

      - hospital-network


volumes:

  mysql_data:


networks:

  hospital-network:

    driver: bridge